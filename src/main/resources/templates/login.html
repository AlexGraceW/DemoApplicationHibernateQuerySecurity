<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - My App</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #f3f3f3;
        }
        .login-box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            padding: 0.5rem 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 1rem;
        }
        h2 {
            text-align: center;
        }
        .error {
            color: #c00;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Login</h2>

    <!-- Показывать ошибку, если параметр error=true -->
    <div th:if="${param.error}" class="error">
        Invalid username or password.
    </div>

    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
